{% extends "base.html" %}
{% block content %}
<section class="auth-card">
<h2>Login</h2>
<form onsubmit="auth(event,'login')">
<label>Email<input id="email" type="email" required></label>
<label>Password<input id="password" type="password" required></label>
<button class="btn">Login</button>
<p id="auth-message"></p>
</form>
</section>
{% endblock %}
